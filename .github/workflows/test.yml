name: Java Spring Boot with Ollama model (AI engineer locally)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Java 21 Environment
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'          # <-- Automatically caches Gradle dependencies

      # Install and Start Ollama Server with DeepSeek Model
      - name: Install and Setup Ollama
        run: |
          # 1. Instalar Ollama de forma nativa en la máquina virtual de Ubuntu
          curl -fsSL https://ollama.com | sh
          
          # 2. Iniciar el servicio de Ollama en segundo plano
          ollama serve &
          
          # 3. Esperar un momento a que el servidor web responda en el puerto 11434
          echo "Esperando a que Ollama responda..."
          until curl -s http://localhost:11434 > /dev/null; do sleep 2; done
          
          # 4. Descargar el modelo específico definido en application.properties
          echo "Descargando modelo deepseek-r1:1.5b..."
          ollama pull deepseek-r1:1.5b

      # Grant execute permissions for the Gradle Wrapper
      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      # Run sequentially Spring Boot test and pitest using Gradle Wrapper 
      # Passes Redis and Ollama env properties to the execution contexts
      - name: Run Spring Boot Tests and PiTest
        run: ./gradlew clean test pitest
        env:
          SPRING_AI_OLLAMA_BASE_URL: http://localhost:11434
          SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL: deepseek-r1:1.5b
