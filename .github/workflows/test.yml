name: Java CI with Redis (Gradle)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Setup the Redis container natively
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Java 21 Environment
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'          # <-- Updated to automatically cache Gradle dependencies

      # Grant execute permissions for the Gradle Wrapper
      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      # Run sequentially Spring Boot test and pitest using Gradle Wrapper & passes the Redis env to both execution contexts
      - name: Run Spring Boot Tests and PiTest
        run: ./gradlew clean test pitest
        env:
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379